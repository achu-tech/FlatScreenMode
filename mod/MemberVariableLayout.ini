; PAYDAY: Aces High Demo (UE 5.6.1 + AngelScript fork, build CL-130429)
; Measured from live memory (tools/layout.py). Only UClass differs from stock 5.6:
; AngelScript inserts GenericFuncPtrMap (TMap, 0x50) + ScriptTypePtr + bIsScriptClass after ClassWithin.
; UStruct / UFunction / UScriptStruct were checked and match stock 5.6, so they are not overridden.
[UClass]
ClassConstructor = 0xB0
ClassVTableHelperCtorCaller = 0xB8
ClassUnique = 0xC8
FirstOwnedClassRep = 0xCC
bCooked = 0xD0
bLayoutChanging = 0xD1
ClassFlags = 0xD4
ClassWithin = 0xE0
GenericFuncPtrMap = 0xE8
ScriptTypePtr = 0x138
bIsScriptClass = 0x140
ClassConfigName = 0x144
ClassCastFlags = 0xD8
ClassReps = 0x150
NetFields = 0x160
ClassDefaultObject = 0x170
SparseClassData = 0x178
SparseClassDataStruct = 0x180
FuncMap = 0x188
FuncMapLock = 0x1D8
AllFunctionsCache = 0x1E0
AllFunctionsCacheLock = 0x230
Interfaces = 0x238
ReferenceSchema = 0x248
NativeFunctionLookupTable = 0x250

; FProperty is 0x78 bytes here (stock 5.6: 0x70). Offset_Internal moved 0x44->0x48, every later field +8,
; so every FProperty subclass field is +8 too. Verified: Offset_Internal, PropertyLinkNext, NextRef,
; RepNotifyFunc, FStructProperty::Struct, FObjectProperty::PropertyClass, FBoolProperty masks, FArrayProperty::Inner.
[FProperty]
ArrayDim = 0x30
ElementSize = 0x34
PropertyFlags = 0x38
RepIndex = 0x40
Offset_Internal = 0x48
PropertyLinkNext = 0x50
NextRef = 0x58
DestructorLinkNext = 0x60
PostConstructLinkNext = 0x68
RepNotifyFunc = 0x70
[FObjectPropertyBase]
PropertyClass = 0x78
[FClassProperty]
MetaClass = 0x80
[FSoftClassProperty]
MetaClass = 0x80
[FInterfaceProperty]
InterfaceClass = 0x78
[FStructProperty]
Struct = 0x78
[FBoolProperty]
FieldSize = 0x78
ByteOffset = 0x79
ByteMask = 0x7A
FieldMask = 0x7B
[FByteProperty]
Enum = 0x78
[FEnumProperty]
UnderlyingProp = 0x78
Enum = 0x80
[FArrayProperty]
ArrayFlags = 0x78
Inner = 0x80
[FSetProperty]
ElementProp = 0x78
[FMapProperty]
KeyProp = 0x78
ValueProp = 0x80
MapFlags = 0xA0
[FDelegateProperty]
SignatureFunction = 0x78
[FMulticastDelegateProperty]
SignatureFunction = 0x78
[FFieldPathProperty]
PropertyClass = 0x78
